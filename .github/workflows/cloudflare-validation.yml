name: Validate Cloudflare beta build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Test, build, and migration consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated migrations are current
        run: |
          npm run db:generate
          git diff --exit-code -- db/schema.ts drizzle drizzle.config.ts

      - name: Run tests
        run: npm test

      - name: Build Worker and static assets
        run: npm run build

      - name: Run non-deploying Cloudflare preflight
        run: npm run preflight
