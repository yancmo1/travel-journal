services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-travel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-travel_user} -d ${POSTGRES_DB:-travel_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-travel_user}:${POSTGRES_PASSWORD:-travel_pass}@postgres:5432/${POSTGRES_DB:-travel_tracker}
      - JWT_SECRET=${JWT_SECRET:-change_this_to_a_secure_secret_key}
      - ALLOW_PUBLIC_REGISTRATION=${ALLOW_PUBLIC_REGISTRATION:-false}
      - PHOTO_STORAGE_PATH=/app/media/travel-photos
      - HOME_LATITUDE=${HOME_LATITUDE:-35.4676}
      - HOME_LONGITUDE=${HOME_LONGITUDE:-97.5164}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY:-}
      - BACKUP_STATUS_PATH=/app/maintenance/backup-status.json
      - BACKUP_STALE_AFTER_HOURS=${BACKUP_STALE_AFTER_HOURS:-30}
      - PORT=4000
      - NODE_ENV=production
    volumes:
      - photo_storage:/app/media/travel-photos
      - ./data/maintenance:/app/maintenance:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Nginx serving built React app)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    restart: unless-stopped
    ports:
      - "3080:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  photo_storage:
