name = "travel-journal"
main = "dist/server/index.js"
compatibility_date = "2026-08-03"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 0.1

# The Worker serves the Vite output through env.ASSETS. Keep this separate from
# the existing Sites deployment until the beta smoke and migration gates pass.
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "postcards-of-us-beta-db"
database_id = "d0b69e24-03e0-49cf-8205-265958dfd441"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "postcards-of-us-beta-media"

[vars]
ALLOW_PUBLIC_REGISTRATION = "false"
EMAIL_FROM = "Postcards of Us <postcards@mail.postcardsofus.com>"
BUG_REPORT_TO = "bugs@postcardsofus.com"
ENABLE_BACKGROUND_JOBS = "true"
ENABLE_AUTOMATIC_BACKUPS = "true"
ENABLE_UPLOADS = "true"
ENABLE_INVITATIONS = "true"
ENABLE_SHARING = "true"
ENABLE_PLACES = "true"
ENABLE_LOCATION_LOOKUPS = "true"
ENABLE_HOUSEHOLD_DELETION = "false"
ENABLE_MIGRATION_ENDPOINTS = "false"
ENABLE_BACKUP_RUNNER = "false"
PHOTO_PROCESSOR_MODE = "browser"
MAX_LOCATION_BACKFILL_PER_RUN = "3"
MAX_STORAGE_BYTES_PER_HOUSEHOLD = "1073741824"
MAX_UPLOAD_BYTES = "20971520"
MAX_UPLOADS_PER_REQUEST = "5"
MAX_UPLOADS_PER_DAY = "0"
MAX_UPLOAD_BYTES_PER_DAY = "0"
MAX_ANALYTICS_TRIPS = "5000"
EXPORT_MEDIA_PER_JOB = "10"
GOOGLE_PLACES_CACHE_TTL_MS = "300000"
GOOGLE_PLACES_CACHE_MAX_ENTRIES = "200"
LOCATION_CACHE_MAX_ENTRIES = "5000"
LOCATION_USER_AGENT = "postcardsofus-beta/1.0 (migration owner contact configured in Cloudflare)"

[triggers]
crons = ["*/15 * * * *"]
